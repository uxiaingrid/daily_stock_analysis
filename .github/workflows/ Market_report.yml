name: Market Auto Report
on:
  schedule:
  
  workflow_dispatch: # 支持手动点按钮立即运行测试

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install python & dependencies
        run: |
          pip install yfinance zhipuai requests sniffio anyio

      - name: Run script
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          AGENT_SKILLS: ${{ secrets.AGENT_SKILLS }}
          BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
        run: python market_analysis.py
