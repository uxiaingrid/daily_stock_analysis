name: Market Auto Report
on:
  schedule:
    # UTC时间每周一至周五 22:00 触发 → 北京时间 次日早上06:00
    - cron: '0 22 * * 1-5' # UTC周一至周五22点，北京时间周二~周六06:00，美股收盘复盘
  workflow_dispatch: # 支持手动点按钮立即运行测试

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install python & dependencies
        run: |
          pip install yfinance zhipuai requests sniffio

      - name: Run script
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: python market_analysis.py
