name: Market Auto Report
on:
  schedule:
    # cron是UTC时间，对应北京时间 周六 早上8点（美股周五收盘后）
    - cron: '0 0 * * 6'
  workflow_dispatch: # 支持手动点按钮立即运行测试

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install python & dependencies
        run: |
          pip install yfinance zhipuai requests

      - name: Run script
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python market_analysis.py
