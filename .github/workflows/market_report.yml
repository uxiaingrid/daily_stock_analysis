name: Market Auto Report
on:
    schedule:
    # UTC时间，每周1~5 10点执行，等于北京时间 18:00，美股当日收盘后生成报告
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # 支持手动点按钮立即运行测试

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install python & dependencies
        run: |
          pip install yfinance zhipuai requests sniffio anyio

      - name: Run script
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: python market_analysis.py
